<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGN Secure Bridge</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fixed: Added Correct PeerJS CDN Library -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div class="header-user">
        <div class="user-badge">
            <span class="avatar">R</span> <span id="userNameDisplay">Roshan Kumar</span>
        </div>
    </div>

    <div class="main-container">
        <h1 class="title">PGN Secure Bridge</h1>
        
        <div class="id-section">
            <p class="my-id-label">Your ID: <span id="my-id" class="highlight-id">Generating...</span></p>
            <p class="status-node">● Node Online</p>
        </div>

        <div class="contacts-section">
            <span class="label-text">Roushan Yadav ( Owner):</span>
            <div class="contacts-buttons">
                <button class="btn-contact" onclick="setRemoteId('IN-BR-PRINCE-1111')">Instagram (yadavroushan4011)</button>
                <button class="btn-contact" onclick="setRemoteId('IN-BR-PRINCE-2222')">Follow Now</button>
            </div>
        </div>

        <div class="input-group">
            <input type="text" id="remote-id-input" placeholder="Remote ID (e.g., Don't Call Me )">
        </div>

        <div class="call-actions">
            <button class="btn-video" id="videoCallBtn">Video Call</button>
            <button class="btn-audio" id="audioCallBtn">Audio Call</button>
        </div>

        <!-- Video Elements Container -->
        <div class="video-container" id="videoArea" style="display:none; margin: 15px 0; border: 1px solid #0f0; padding: 10px; border-radius: 8px;">
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <video id="localVideo" autoplay muted playsinline style="width: 50%; background: #000; border-radius: 4px;"></video>
                <video id="remoteVideo" autoplay playsinline style="width: 50%; background: #000; border-radius: 4px;"></video>
            </div>
            <button class="btn-delete" id="endCallBtn" style="width: 100%;">End Call</button>
        </div>

        <div class="vault-header">
            <span class="vault-title">Direct P2P Vault</span>
            <button class="btn-delete" onclick="clearChat()">Hard Delete Chat</button>
        </div>

        <!-- Fixed Chatbox Container to accept messages naturally -->
        <div class="chat-box" id="chat-box" style="height: 200px; border: 1px solid #333; overflow-y: auto; padding: 10px; margin-bottom: 10px; background: #050505; color: #0f0; font-family: monospace; border-radius: 5px; white-space: pre-wrap;"></div>

        <div class="message-input-area">
            <input type="text" id="msg-input" placeholder="Type message...">
            <button class="btn-send" id="sendMsgBtn">Send</button>
        </div>

        <div class="media-section">
            <label class="media-label">Send Photo / Video:</label>
            <div class="file-upload-wrapper">
                <input type="file" id="file-input">
                <button class="btn-media" id="sendMediaBtn">Send Media</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Helper to click on contacts
        function setRemoteId(id) {
            document.getElementById('remote-id-input').value = id;
        }
    </script>
</body>
</html>
