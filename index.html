<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGN Secure Bridge</title>
    <link rel="stylesheet" href="style.css">
    <!-- PeerJS Library for P2P Video/Audio/Chat -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div class="header-user">
        <div class="user-badge">
            <span class="avatar">R</span> <span id="userNameDisplay">Roshan Kumar</span>
        </div>
    </div>

    <div class="main-container">
        <h1 class="title">PGN Secure Bridge</h1>
        
        <div class="id-section">
            <p class="my-id-label">Your ID: <span id="my-id" class="highlight-id">Generating...</span></p>
            <p class="status-node">● Node Online</p>
        </div>

        <div class="contacts-section">
            <span class="label-text">Saved Contacts:</span>
            <div class="contacts-buttons">
                <button class="btn-contact" onclick="setRemoteId('IN-BR-PRINCE-1111')">PRINCE (BR)</button>
                <button class="btn-contact" onclick="setRemoteId('IN-BR-PRINCE-2222')">PRINCE (BR)</button>
            </div>
        </div>

        <div class="input-group">
            <input type="text" id="remote-id-input" placeholder="Remote ID (e.g., IN-TG-PRINCE-8A1C)">
        </div>

        <div class="call-actions">
            <button class="btn-video" id="videoCallBtn">Video Call</button>
            <button class="btn-audio" id="audioCallBtn">Audio Call</button>
        </div>

        <!-- Video Elements (Hidden by default, shows during call) -->
        <div class="video-container" id="videoArea" style="display:none;">
            <video id="localVideo" autoplay muted playsinline></video>
            <video id="remoteVideo" autoplay playsinline></video>
            <button class="btn-delete" id="endCallBtn">End Call</button>
        </div>

        <div class="vault-header">
            <span class="vault-title">Direct P2P Vault</span>
            <button class="btn-delete" onclick="clearChat()">Hard Delete Chat</button>
        </div>

        <div class="chat-box" id="chat-box">
            <!-- Messages will appear here -->
        </div>

        <div class="message-input-area">
            <input type="text" id="msg-input" placeholder="Type message...">
            <button class="btn-send" id="sendMsgBtn">Send</button>
        </div>

        <div class="media-section">
            <label class="media-label">Send Photo / Video:</label>
            <div class="file-upload-wrapper">
                <input type="file" id="file-input">
                <button class="btn-media" id="sendMediaBtn">Send Media</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
