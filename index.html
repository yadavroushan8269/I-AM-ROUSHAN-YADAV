<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NSG Power Bank</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

<header>Power Bank</header>

<section class="hero">

  <div class="profile">
    <div class="avatar">₮</div>
    <div>
      <b>ID:<span id="userId"></span></b>
      <small>Welcome back</small>
    </div>
  </div>

  <div class="actions">
    <button onclick="virtualDeposit()">Deposit</button>
    <button onclick="virtualWithdraw()">Withdraw</button>
  </div>

</section>

<section class="stats">

  <div>
    <strong id="recharge">₹50.00</strong>
    <span>Recharge Balance</span>
  </div>

  <div>
    <strong id="withdraw">₹0.00</strong>
    <span>Withdrawal Balance</span>
  </div>

  <div>
    <strong id="totalRecharge">₹50.00</strong>
    <span>Total Recharge</span>
  </div>

  <div>
    <strong id="totalWithdraw">₹0.00</strong>
    <span>Total Withdraw</span>
  </div>

</section>

<div class="promo">
  <div class="coins">🪙 🪙</div>
  <b>Promo</b>
</div>

<section class="menu-list">

  <button onclick="invite()">
    <i>✉️</i>
    <span>Invite Friends</span>
    <b>›</b>
  </button>

  <button onclick="plans()">
    <i>📋</i>
    <span>Plan Record</span>
    <b>›</b>
  </button>

  <button onclick="bank()">
    <i>🏦</i>
    <span>Bank Account</span>
    <b>›</b>
  </button>

  <button onclick="commission()">
    <i>📋</i>
    <span>My Commission History</span>
    <b>›</b>
  </button>

</section>

<nav>
  <button class="active">⌂<small>Home</small></button>
  <button onclick="invest()">¥<small>Invest</small></button>
  <button class="center" onclick="virtualDeposit()">＋</button>
  <button onclick="team()">♟<small>My team</small></button>
  <button onclick="profile()">♙<small>Profile</small></button>
</nav>

</div>

<script src="script.js"></script>
</body>
</html>
