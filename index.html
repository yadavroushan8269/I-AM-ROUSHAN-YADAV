<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGN Secure Bridge</title>
    <link rel="stylesheet" href="style.css">
    <!-- PeerJS Library for P2P Video/Audio Calling -->
    <script src="https://unpkg.com"></script>
</head>
<body>
    <div class="container">
        <h2>PGN Secure Bridge</h2>
        
        <!-- Peer Connection Status -->
        <div class="status-box">
            <p>Your ID: <span id="my-id" style="color: #00ff00; font-weight: bold;">Loading...</span></p>
            <input type="text" id="remote-id" placeholder="Enter Target User ID...">
        </div>

        <!-- Video Feeds Section -->
        <div class="video-container">
            <video id="local-video" autoplay muted playsinline></video>
            <video id="remote-video" autoplay playsinline></video>
        </div>

        <!-- Calling Controls -->
        <div class="controls">
            <button id="video-call-btn" class="btn">Video Call</button>
            <button id="audio-call-btn" class="btn">Audio Call</button>
            <button id="hangup-btn" class="btn hangup">Hang Up (कॉल काटें)</button>
        </div>

        <!-- Chat Vault Section -->
        <h3>Direct P2P Vault</h3>
        <div id="chatBox" class="chat-box">
            <p style="color: #888;">System Standby...</p>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="msgInput" placeholder="Type message...">
            <button id="send-btn">Send</button>
        </div>
        <button id="clear-btn" class="btn delete">Hard Delete Chat</button>
    </div>
</body>
</html>
