<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call System UI</title>
    <!-- CSS File Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="phone-container">
        <!-- Display Screen -->
        <div class="screen">
            <div class="status-bar">
                <span>12:00 PM</span>
                <span>🔋 100%</span>
            </div>
            <div class="number-display" id="display"></div>
            <div class="call-status" id="status">Ready</div>
        </div>

        <!-- Keypad Grid -->
        <div class="keypad">
            <button class="key" onclick="pressKey('1')">1</button>
            <button class="key" onclick="pressKey('2')">2</button>
            <button class="key" onclick="pressKey('3')">3</button>
            <button class="key" onclick="pressKey('4')">4</button>
            <button class="key" onclick="pressKey('5')">5</button>
            <button class="key" onclick="pressKey('6')">6</button>
            <button class="key" onclick="pressKey('7')">7</button>
            <button class="key" onclick="pressKey('8')">8</button>
            <button class="key" onclick="pressKey('9')">9</button>
            <button class="key btm-key" onclick="pressKey('*')">*</button>
            <button class="key" onclick="pressKey('0')">0</button>
            <button class="key btm-key" onclick="pressKey('#')">#</button>
        </div>

        <!-- Action Buttons -->
        <div class="actions">
            <button class="btn-call" id="callBtn" onclick="toggleCall()">📞 Call</button>
            <button class="btn-clear" onclick="clearDisplay()">⌫ Clear</button>
        </div>
    </div>

    <!-- JavaScript File Link -->
    <script src="script.js"></script>
</body>
</html>
